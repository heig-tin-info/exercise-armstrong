# Indicative feedback on every push. The grade comes from the Quiz platform.
name: grading
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  grading:
    uses: heig-tin-info/score/.github/workflows/grading.yml@0.7.5
    with:
      criteria-file: criteria.yml
      build-command: make
      test-command: pip install pytest && pytest --junitxml=report.xml
      tests-criterion: tests.all-tests-passed
      scale: "6"
